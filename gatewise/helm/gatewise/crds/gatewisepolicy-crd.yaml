apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: gatewisepolicies.gatewise.io
  annotations:
    controller-gen.kubebuilder.io/version: v0.9.0
spec:
  group: gatewise.io
  names:
    kind: GatewisePolicy
    listKind: GatewisePolicyList
    plural: gatewisepolicies
    singular: gatewisepolicy
    shortNames:
      - gwpolicy
      - gwp
  scope: Namespaced
  versions:
    - name: v1
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          description: GatewisePolicy is the Schema for the gatewisepolicies API
          type: object
          properties:
            apiVersion:
              description: 'APIVersion defines the versioned schema of this representation
                of an object. Servers should convert recognized schemas to the latest
                internal value, and may reject unrecognized values.'
              type: string
            kind:
              description: 'Kind is a string value representing the REST resource this
                object represents. Servers may infer this from the endpoint the client
                submits requests to. Cannot be updated. In CamelCase.'
              type: string
            metadata:
              type: object
            spec:
              description: GatewisePolicySpec defines the desired state of GatewisePolicy
              type: object
              required:
                - team
              properties:
                team:
                  description: Team name for this policy
                  type: string
                kubernetes:
                  description: Kubernetes resources configuration
                  type: object
                  properties:
                    namespaces:
                      type: array
                      items:
                        type: object
                        required:
                          - name
                        properties:
                          name:
                            type: string
                          labels:
                            type: object
                            additionalProperties:
                              type: string
                          quotas:
                            type: object
                            properties:
                              cpu:
                                type: string
                              memory:
                                type: string
                              pods:
                                type: string
                              persistentvolumeclaims:
                                type: string
                    rbac:
                      type: array
                      items:
                        type: object
                        required:
                          - role
                          - subjects
                        properties:
                          role:
                            type: string
                            enum:
                              - admin
                              - edit
                              - view
                          subjects:
                            type: array
                            items:
                              type: object
                              required:
                                - kind
                                - name
                              properties:
                                kind:
                                  type: string
                                  enum:
                                    - User
                                    - Group
                                    - ServiceAccount
                                name:
                                  type: string
                kafka:
                  description: Kafka resources configuration
                  type: object
                  properties:
                    topics:
                      type: array
                      items:
                        type: object
                        required:
                          - name
                        properties:
                          name:
                            type: string
                          partitions:
                            type: integer
                            minimum: 1
                          replication:
                            type: integer
                            minimum: 1
                          config:
                            type: object
                            additionalProperties:
                              type: string
                    acls:
                      type: array
                      items:
                        type: object
                        required:
                          - principal
                          - operations
                        properties:
                          principal:
                            type: string
                          operations:
                            type: array
                            items:
                              type: string
                              enum:
                                - Read
                                - Write
                                - Create
                                - Delete
                                - Alter
                                - Describe
                                - All
                          topics:
                            type: array
                            items:
                              type: string
                kong:
                  description: Kong resources configuration
                  type: object
                  properties:
                    routes:
                      type: array
                      items:
                        type: object
                        required:
                          - name
                          - service
                          - paths
                        properties:
                          name:
                            type: string
                          service:
                            type: string
                          paths:
                            type: array
                            items:
                              type: string
                          methods:
                            type: array
                            items:
                              type: string
                          stripPath:
                            type: boolean
                    services:
                      type: array
                      items:
                        type: object
                        required:
                          - name
                          - url
                        properties:
                          name:
                            type: string
                          url:
                            type: string
                          protocol:
                            type: string
                            enum:
                              - http
                              - https
                          retries:
                            type: integer
                    plugins:
                      type: array
                      items:
                        type: object
                        required:
                          - name
                        properties:
                          name:
                            type: string
                          config:
                            type: object
                            x-kubernetes-preserve-unknown-fields: true
            status:
              description: GatewisePolicyStatus defines the observed state of GatewisePolicy
              type: object
              properties:
                phase:
                  description: Phase represents the current phase of the policy
                  type: string
                  enum:
                    - Pending
                    - Reconciling
                    - Active
                    - Failed
                    - Deleting
                conditions:
                  description: Conditions represent the latest available observations
                  type: array
                  items:
                    type: object
                    required:
                      - type
                      - status
                    properties:
                      type:
                        type: string
                      status:
                        type: string
                        enum:
