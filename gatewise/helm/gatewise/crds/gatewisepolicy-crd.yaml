                          - "False"
                          - Unknown
                      lastTransitionTime:
                        type: string
                        format: date-time
                      reason:
                        type: string
                      message:
                        type: string
                lastReconcileTime:
                  description: Last time the policy was reconciled
                  type: string
                  format: date-time
                appliedResources:
                  description: Resources that were applied
                  type: object
                  properties:
                    namespaces:
                      type: array
                      items:
                        type: string
                    topics:
                      type: array
                      items:
                        type: string
                    routes:
                      type: array
                      items:
                        type: string
                observedGeneration:
                  description: ObservedGeneration reflects the generation most recently observed
                  type: integer
                  format: int64
      subresources:
        status: {}
      additionalPrinterColumns:
        - name: Team
          type: string
          jsonPath: .spec.team
        - name: Phase
          type: string
          jsonPath: .status.phase
        - name: Age
          type: date
          jsonPath: .metadata.creationTimestamp
