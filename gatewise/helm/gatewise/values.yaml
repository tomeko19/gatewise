# Gatewise Helm Chart Configuration
# BYOI (Bring Your Own Infrastructure) - Set enabled: false to use external services

# ============ Global Settings ============
global:
  imageRegistry: ""
  imagePullSecrets: []

# ============ Control Plane ============
controlPlane:
  replicaCount: 1
  
  image:
    repository: gatewise/control-plane
    tag: "0.2.0-alpha"
    pullPolicy: IfNotPresent
  
  service:
    type: ClusterIP
    port: 8001
  
  ingress:
    enabled: false
    className: "nginx"
    annotations: {}
    hosts:
      - host: gatewise.local
        paths:
          - path: /
            pathType: Prefix
    tls: []
  
  resources:
    limits:
      cpu: 500m
      memory: 512Mi
    requests:
      cpu: 100m
      memory: 128Mi
  
  # Environment variables
  env:
    LOG_LEVEL: info
  
  # License configuration
  license:
    key: ""  # Set to ENT-xxx for Enterprise features
    secretName: ""  # Or reference existing secret
    tier: "community"  # community or enterprise
  
  # Community Edition limits
  communityLimits:
    maxPolicies: 5
    maxClusters: 1
    jitGrantsPerDay: 2
    enabled: true

# ============ Agent (In-Cluster) ============
agent:
  enabled: true
  replicaCount: 1
  
  image:
    repository: gatewise/agent
    tag: "0.2.0-alpha"
    pullPolicy: IfNotPresent
  
  # Reconciliation settings
  reconcile:
    interval: 30s
    retryLimit: 3
  
  # Self-healing (Enterprise)
  selfHealing:
    enabled: false  # Requires Enterprise license
    interval: 5m
    autoRepair: true
  
  # JIT Access (Enterprise)
  jit:
    enabled: false  # Requires Enterprise license
    maxDuration: 24h
    defaultDuration: 2h
    maxRenewals: 2
  
  resources:
    limits:
      cpu: 200m
      memory: 256Mi
    requests:
      cpu: 50m
      memory: 64Mi
  
  serviceAccount:
    create: true
    name: gatewise-agent
    annotations: {}
  
  # RBAC for agent
  rbac:
    create: true
    clusterRole: true  # Set to false for namespace-scoped

# ============ Dashboard ============
dashboard:
  enabled: true
  replicaCount: 1
  
  image:
    repository: gatewise/dashboard
    tag: "0.2.0-alpha"
    pullPolicy: IfNotPresent
  
  service:
    type: ClusterIP
    port: 3000
  
  ingress:
    enabled: false
    className: "nginx"
    annotations: {}
    hosts:
      - host: dashboard.gatewise.local
        paths:
          - path: /
            pathType: Prefix
    tls: []

# ============ PostgreSQL (BYOI) ============
postgresql:
  # Set to false to use external PostgreSQL
  enabled: true
  
  # Image configuration - Official PostgreSQL (NOT Bitnami - now paid)
  image:
    repository: postgres
    tag: "16-alpine"
    pullPolicy: IfNotPresent
  
  # Embedded PostgreSQL settings (when enabled: true)
  auth:
    username: gatewise
    password: gatewise123
    database: gatewise
  
  primary:
    persistence:
      enabled: true
      size: 10Gi
  
  # External PostgreSQL settings (when enabled: false)
  external:
    host: ""
    port: 5432
    username: ""
    password: ""
    database: ""
    sslMode: require
    # Or use existing secret
    existingSecret: ""
    existingSecretKey: "postgresql-password"

# ============ MongoDB (Alternative to PostgreSQL) ============
mongodb:
  # Set to true to use MongoDB instead of PostgreSQL
  enabled: false
  
  # Image configuration - Official MongoDB 8+ (NOT Bitnami - now paid)
  image:
    repository: mongo
    tag: "8-jammy"
    pullPolicy: IfNotPresent
  
  auth:
    enabled: true
    rootUser: root
    rootPassword: gatewise123
    database: gatewise
  
  persistence:
    enabled: true
    size: 10Gi
  
  # External MongoDB settings
  external:
    connectionString: ""
    # Example: "mongodb://user:pass@host:27017/gatewise"
    existingSecret: ""
    existingSecretKey: "mongodb-connection-string"

# ============ Kafka (BYOI - Enterprise) ============
kafka:
  # Set to false to use external Kafka
  enabled: false
  
  # Image configuration - Official Apache Kafka (NOT Bitnami - now paid)
  image:
    repository: apache/kafka
    tag: "3.6.1"
    pullPolicy: IfNotPresent
  
  # Embedded Kafka settings (when enabled: true)
  replicaCount: 1
  
  # Community Edition limits
  communityLimits:
    maxTopics: 3
    enabled: true
  
  # External Kafka settings (when enabled: false)
  external:
    brokers: []
    # Example: ["kafka-1:9092", "kafka-2:9092"]
    sasl:
      enabled: false
      mechanism: PLAIN
      username: ""
      password: ""
    tls:
      enabled: false
      certFile: ""
      keyFile: ""
      caFile: ""
    # Or use existing secret
    existingSecret: ""

# ============ Kong (BYOI - Enterprise) ============
kong:
  # Set to false to use external Kong
  enabled: false
  
  # Image configuration - Official Kong (NOT Bitnami - now paid)
  image:
    repository: kong
    tag: "3.5-alpine"
    pullPolicy: IfNotPresent
  
  # Embedded Kong settings (when enabled: true)
  proxy:
    type: LoadBalancer
  admin:
    enabled: true
    type: ClusterIP
  
  # Community Edition limits
  communityLimits:
    maxRoutes: 20
    enabled: true
  
  # External Kong settings (when enabled: false)
  external:
    adminUrl: ""
    # Example: "http://kong-admin:8001"
    apiKey: ""
    # Or use existing secret
    existingSecret: ""
    existingSecretKey: "kong-admin-token"

# ============ Keycloak (BYOI - Enterprise) ============
keycloak:
  enabled: false
  
  external:
    url: ""
    realm: ""
    clientId: ""
    clientSecret: ""
    existingSecret: ""

# ============ Cerbos (BYOI - Enterprise) ============
cerbos:
  enabled: false
  
  external:
    url: ""
    # Example: "http://cerbos:3592"

# ============ Monitoring ============
monitoring:
  # Prometheus metrics
  prometheus:
    enabled: true
    port: 9090
    path: /metrics
  
  # ServiceMonitor for Prometheus Operator
  serviceMonitor:
    enabled: false
    interval: 30s
    labels: {}
  
  # Prometheus rules
  prometheusRule:
    enabled: false
    rules: []
  
  # Grafana dashboard
  grafana:
    enabled: true
    dashboardConfigMap: gatewise-grafana-dashboard

# ============ Security ============
security:
  podSecurityContext:
    runAsNonRoot: true
    runAsUser: 1000
    fsGroup: 1000
  
  containerSecurityContext:
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: true
    capabilities:
      drop:
        - ALL

# ============ Node Selection ============
nodeSelector: {}

tolerations: []

affinity: {}
