apiVersion: v1
kind: Service
metadata:
  name: {{ include "gatewise.fullname" . }}-control-plane
  labels:
    {{- include "gatewise.labels" . | nindent 4 }}
    app.kubernetes.io/component: control-plane
spec:
  type: {{ .Values.controlPlane.service.type }}
  ports:
    - port: {{ .Values.controlPlane.service.port }}
      targetPort: http
      protocol: TCP
      name: http
  selector:
    {{- include "gatewise.controlPlane.selectorLabels" . | nindent 4 }}
---
{{- if .Values.dashboard.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "gatewise.fullname" . }}-dashboard
  labels:
    {{- include "gatewise.labels" . | nindent 4 }}
    app.kubernetes.io/component: dashboard
spec:
  type: {{ .Values.dashboard.service.type }}
  ports:
    - port: {{ .Values.dashboard.service.port }}
      targetPort: http
      protocol: TCP
      name: http
  selector:
    {{- include "gatewise.dashboard.selectorLabels" . | nindent 4 }}
{{- end }}
