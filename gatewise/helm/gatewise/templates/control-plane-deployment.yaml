apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "gatewise.fullname" . }}-control-plane
  labels:
    {{- include "gatewise.labels" . | nindent 4 }}
    app.kubernetes.io/component: control-plane
spec:
  replicas: {{ .Values.controlPlane.replicaCount }}
  selector:
    matchLabels:
      {{- include "gatewise.controlPlane.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "gatewise.controlPlane.selectorLabels" . | nindent 8 }}
    spec:
      {{- with .Values.global.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        {{- toYaml .Values.security.podSecurityContext | nindent 8 }}
      containers:
        - name: control-plane
          image: "{{ .Values.controlPlane.image.repository }}:{{ .Values.controlPlane.image.tag }}"
          imagePullPolicy: {{ .Values.controlPlane.image.pullPolicy }}
          securityContext:
            {{- toYaml .Values.security.containerSecurityContext | nindent 12 }}
          ports:
            - name: http
              containerPort: 8001
              protocol: TCP
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ include "gatewise.fullname" . }}-secrets
                  key: database-url
            - name: LOG_LEVEL
              value: {{ .Values.controlPlane.env.LOG_LEVEL | quote }}
            {{- if .Values.controlPlane.license.key }}
            - name: GATEWISE_LICENSE_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "gatewise.fullname" . }}-secrets
                  key: license-key
            {{- end }}
            {{- if not .Values.kafka.enabled }}
            - name: KAFKA_BROKERS
              value: {{ include "gatewise.kafka.brokers" . | quote }}
            {{- end }}
            {{- if not .Values.kong.enabled }}
            - name: KONG_ADMIN_URL
              value: {{ include "gatewise.kong.adminUrl" . | quote }}
            {{- end }}
          livenessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
          resources:
            {{- toYaml .Values.controlPlane.resources | nindent 12 }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
